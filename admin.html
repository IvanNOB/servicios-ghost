<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <title>Admin · Servicios Ghost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin">
  <header class="admin-header">
    <a class="logo" href="index.html" aria-label="Ir a la tienda">
      <span class="logo__ghost" aria-hidden="true">👻</span>
      <span class="logo__text">Servicios <span class="logo__accent">Ghost</span></span>
      <span class="logo__tag">Admin</span>
    </a>
    <div class="admin-header__right" id="headerRight" hidden>
      <span class="admin-user" id="adminUser"></span>
      <button type="button" class="btn-copy" id="btnSalir">Cerrar sesión</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- Login -->
    <section class="panel panel--narrow" id="vistaLogin" hidden>
      <h2 class="panel__title">Entrar al panel</h2>
      <form id="loginForm" class="form">
        <div class="field">
          <label class="field__label" for="loginEmail">Correo</label>
          <input class="field__input" id="loginEmail" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label class="field__label" for="loginPass">Contraseña</label>
          <input class="field__input" id="loginPass" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="btnEntrar">Entrar</button>
        <p class="copy-msg copy-msg--error" id="loginError" role="alert"></p>
      </form>
    </section>

    <!-- Panel (lista + editor) -->
    <section id="vistaPanel" hidden>
      <!-- Pestañas: Restaurantes / Pedidos -->
      <div class="tabs" role="tablist">
        <button type="button" class="tab tab--active" data-tab="restaurantes" role="tab">🍽️ Restaurantes</button>
        <button type="button" class="tab" data-tab="pedidos" role="tab">📋 Pedidos</button>
      </div>

      <!-- Pestaña Restaurantes -->
      <div id="tabRestaurantes" class="tab-panel">
        <div class="panel__row">
          <h2 class="panel__title">Restaurantes</h2>
          <div class="inline-actions">
            <button type="button" class="btn-copy" id="btnMigrar" title="Sube los restaurantes de ejemplo (data.js) a la base de datos">⬆️ Migrar ejemplos</button>
            <button type="button" class="btn-primary" id="btnNuevo">+ Nuevo restaurante</button>
          </div>
        </div>
        <div id="listaRest" class="admin-grid" aria-live="polite"></div>
      </div>

      <!-- Pestaña Pedidos -->
      <div id="tabPedidos" class="tab-panel" hidden>
        <div class="panel__row">
          <h2 class="panel__title">Pedidos</h2>
          <div class="inline-actions">
            <select id="filtroPedidos" class="field__select" aria-label="Filtrar por estado">
              <option value="todos">Todos</option>
              <option value="recibido">Recibidos</option>
              <option value="preparando">Preparando</option>
              <option value="listo">Listos</option>
              <option value="en-camino">En camino</option>
              <option value="entregado">Entregados</option>
              <option value="cancelado">Cancelados</option>
            </select>
            <button type="button" class="btn-copy" id="btnRefrescarPedidos" aria-label="Actualizar">🔄 Actualizar</button>
          </div>
        </div>
        <div id="listaPedidos" class="pedidos-list" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <!-- Editor de restaurante (hoja) -->
  <div class="sheet" id="editorSheet" hidden>
    <div class="sheet__backdrop" data-editor-close></div>
    <div class="sheet__panel sheet__panel--wide" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="sheet__head">
        <h2 class="sheet__title" id="editorTitle">Restaurante</h2>
        <button type="button" class="icon-btn" data-editor-close aria-label="Cerrar editor">✕</button>
      </div>
      <div class="sheet__body" id="editorBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
